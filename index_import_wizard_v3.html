<head>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="import-wizard-page">
  <div class="import-wizard-container">
    <h3 style="text-align: center">Sample Import Wizard</h3>
    <div>
      <input type="text" id="TitleText" placeholder="Title" required />
      <span class="required-field-label">required</span>
    </div>
    <div>
      <input
        type="number"
        id="pixelsPerMeterValue"
        placeholder="# of pixels per meter"
        min="0"
        step="any"
        required
      />
      <span class="required-field-label">required</span>
    </div>
    <div>
      <input
        type="text"
        id="DescriptionText"
        placeholder="Description (optional)"
      />
    </div>
    <div id="groupContainer">
      <div class="group-row">
        <input
          type="text"
          class="group-input"
          placeholder="Group 1"
          oninput="validateGroupUniqueness()"
        />
        <button
          type="button"
          class="group-btn"
          onclick="addGroup(this)"
          title="Add group"
        >
          +
        </button>
      </div>
    </div>
    <hr />
    <div id="tileSetContainer">
      <!-- Tile set rows will be added dynamically here in JS -->
    </div>
    <hr />
    <div>
      <select
        id="saveTypeDropdown"
        onchange="updateSaveType()"
        title="Specify whether to save as a new or existing library JSON file"
      >
        <option value="createNewJSON" selected>Create new library JSON</option>
        <option value="modifyExistingJSON">Add to existing library JSON</option>
      </select>
    </div>
    <button id="loadExistingJSONBtn" hidden>Select file</button>
    <div id="importProgressContainer" class="import-progress" hidden>
      <div class="import-progress-track">
        <div id="importProgressBar" class="import-progress-bar"></div>
      </div>
      <div id="importProgressText" class="import-progress-text"></div>
    </div>
    <button id="exportJSONBtn">Export JSON</button>
    <input
      type="file"
      id="selectExistingJSON"
      class="file-input"
      style="display: none"
    />
  </div>
  <script src="index_import_wizard.js"></script>
</body>
