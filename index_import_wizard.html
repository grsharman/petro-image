<head>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="import-wizard-page">
  <div class="import-wizard-container">
    <h2>Sample Import Wizard</h2>
    <div>
      <select
        id="saveTypeDropdown"
        onchange="updateSaveType()"
        title="Specify whether to save as a new or existing JSON file"
      >
        <option value="createNewJSON" selected>Create new JSON</option>
        <option value="modifyExistingJSON">Add to existing JSON</option>
      </select>
      <label for="saveTypeDropdown"></label>
    </div>
    <div>
      <label
        for="selectNewJSON"
        id="labelNewJSON"
        class="file-label"
        style="--file-label-width: 141px"
        >Choose output file</label
      >
      <input type="file" id="selectNewJSON" class="file-input" />
    </div>
    <div>
      <label
        for="selectExistingJSON"
        id="labelExistingJSON"
        class="file-label"
        style="--file-label-width: 141px; display: none"
        >Select file</label
      >
      <input type="file" id="selectExistingJSON" class="file-input" />
    </div>
    <hr />
    <h3>Metadata</h3>
    <div>
      <input type="text" id="TitleText" placeholder="Title" />
    </div>
    <div>
      <input
        type="number"
        id="pixelsPerMeterValue"
        placeholder="# of pixels per meter (optional)"
      />
    </div>
    <div>
      <input
        type="text"
        id="DescriptionText"
        placeholder="Description (optional)"
      />
    </div>
    <div id="groupContainer">
      <div class="group-row">
        <input
          type="text"
          class="group-input"
          placeholder="Group 1"
          oninput="validateGroupUniqueness()"
        />
        <button
          type="button"
          class="group-btn"
          onclick="addGroup(this)"
          title="Add group"
        >
          +
        </button>
      </div>
    </div>
    <hr />
    <h3>Image(s)</h3>
    <div id="tileSetContainer">
      <div class="tile-set-row">
        <div class="tile-row-header">
          <!--Tile set label-->
          <span class="tile-set-label">Tile Set 1</span>
          <button type="button" class="img-btn" onclick="addTileRow(this)">
            +
          </button>
          <!--Minus button only appears on added tile sets-->
        </div>

        <!--Tile set dropdown-->
        <select
          onchange="updateTileSetType(this)"
          title="Specify the format for the tile set"
        >
          <option value="Individual" selected>Individual</option>
          <option value="Multiple">Multiple</option>
          <option value="Multiple (rotation enabled)">
            Multiple (rotation enabled)
          </option>
        </select>

        <div class="tile-set-label-container">
          <input type="text" class="tile-set-label" placeholder="Label" />
        </div>
        <!-- Angle periodicity input, shown only for "Multiple (rotation enabled)" -->
        <div class="angle-periodicity-container" style="display: none">
          <label
            >Angle periodicity:
            <input
              type="number"
              class="tile-angle-periodicity"
              placeholder="e.g., 360"
              min="0"
              max="360"
              value="0"
            />
          </label>
        </div>

        <!--Container for image(s) in this tile set-->
        <div class="images-container">
          <div class="image-row">
            <!--The image label for Multiple option-->
            <input type="text" class="image-label" placeholder="Label" hidden />
            <!--The angle input for Multiple (rotation enabled) option-->
            <label hidden
              >Angle (0&minus;360):
              <input
                type="number"
                class="image-angle"
                min="0"
                max="360"
                value="0"
                hidden
              />
            </label>
            <button
              type="button"
              class="img-btn add-btn"
              onclick="addImageRow(this)"
              hidden
            >
              +
            </button>
            <button
              type="button"
              class="img-btn remove-btn"
              onclick="removeImageRow(this)"
              hidden
            >
              &minus;
            </button>
            <div class="jpg-row">
              <label
                class="file-label jpg-label"
                style="--file-label-width: 141px"
                >Select JPG file</label
              >
              <input
                type="file"
                class="file-input jpg-file"
                style="display: none"
              />
              <!-- URI input -->
              <input
                type="text"
                class="uri-input"
                placeholder="Enter image URI"
                style="display: none"
              />

              <!-- Toggle checkbox -->
              <input type="checkbox" onclick="toggleURI(this)" />
              <label>Use URI?</label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="index_import_wizard.js"></script>
</body>
